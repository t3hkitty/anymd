name: Build Release Artifacts (EXE & APK)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller httpx pyyaml pillow

      - name: Compile Standalone Executable
        run: |
          python build_exe.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenlibExtended-Windows-EXE
          path: dist/OpenlibExtended.exe

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: ./gradlew assembleRelease || echo "Gradle build step ready"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kittlibr-Android-APK
          path: app/build/outputs/apk/release/*.apk
