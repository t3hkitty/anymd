name: Sanitize and Scrub PII/Spam

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@1d96c772d19495a3b5c517cd2bc0cb401ea0529f # v4.1.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@82c7e631bb3eae9174d560950f5227f47ee506fc # v5.1.0
        with:
          python-version: '3.11'

      - name: Scan and Scrub PII
        run: |
          find . -type f -not -path '*/.*' -not -path './node_modules/*' -not -path './dist/*' -exec python scripts/scrub_pii_and_spam.py {} \;
